name: Sync Encar → Supabase

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Encar sync
        env:
          CARAPIS_KEY: ${{ secrets.CARAPIS_KEY }}
          SUPABASE_URL: https://opqavzroypnpcqvtzwjb.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node sync-encar.js
