name: Sync auto-api.com → Supabase
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Empêche deux syncs de tourner en même temps (évite les conflits de commit d'état)
concurrency:
  group: sync-auto-api
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write   # nécessaire pour commit .last_change_id / .sync_progress
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run sync
        env:
          AUTOAPI_KEY: ${{ secrets.AUTOAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node sync-encar.js

      - name: Persist sync state (change_id + progress)
        if: always()
        run: |
          git config user.name "tvmc-sync-bot"
          git config user.email "actions@github.com"
          git add -f .last_change_id .sync_progress 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update sync state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Aucun changement d'état à committer"
          fi

      - name: Upload log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-log-${{ github.run_number }}
          path: sync.log
          retention-days: 30
          if-no-files-found: warn
